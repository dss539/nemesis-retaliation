<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nemesis: Retaliation - Digital Edition</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Atmospheric background -->
        <div id="bg-atmosphere"></div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen active">
            <div class="lobby-container">
                <header class="lobby-header">
                    <h1 class="title">NEMESIS</h1>
                    <div class="title-bar"></div>
                    <h2 class="subtitle">RETALIATION</h2>
                    <p class="tagline">Digital Edition</p>
                </header>
                <div class="lobby-actions">
                    <button id="btn-host" class="btn btn-primary" onclick="showHostPanel()">Host Game</button>
                    <button id="btn-join" class="btn btn-secondary" onclick="showJoinPanel()">Join Game</button>
                </div>
                <div id="host-panel" class="hidden panel glass-panel">
                    <header class="host-panel-header">
                        <h2>Host Game</h2>
                        <span class="host-network-status" role="status" aria-label="Connected" title="Connected"></span>
                    </header>

                    <div class="host-panel-grid">
                        <section class="host-invite-section" aria-labelledby="game-code-label">
                            <span id="game-code-label" class="field-label">Game code</span>
                            <div class="code-row">
                                <div id="host-code" class="code-display" title="Click to copy">Generating...</div>
                                <button id="copy-code-btn" class="icon-copy-btn" onclick="copyGameCode()" title="Copy code" aria-label="Copy game code">⧉</button>
                            </div>
                            <div class="join-options">
                                <div id="join-qr-panel" class="join-qr-panel" aria-live="polite">
                                    <div id="join-qr-code" aria-label="QR code for joining this game"></div>
                                    <span>Scan to join</span>
                                </div>
                                <button id="copy-url-btn" class="copy-link-btn" onclick="copyJoinUrl()">Copy link</button>
                                <a id="join-url" class="hidden" href="#" target="_blank" rel="noopener">Generating...</a>
                            </div>
                        </section>

                        <section class="host-roster-section" aria-labelledby="roster-heading">
                            <div class="roster-header">
                                <h3 id="roster-heading">Players <span id="roster-count">0/2</span></h3>
                                <select id="num-players" aria-label="Number of players">
                                    <option value="2" selected>2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </div>
                            <ul id="lobby-players"></ul>
                        </section>
                    </div>

                    <button id="host-start-btn" class="btn btn-primary host-start-btn" onclick="startGame()" disabled>Start Game</button>
                </div>
                <div id="join-panel" class="hidden panel glass-panel">
                    <h2>Join Game</h2>
                    <label for="join-code">Enter host code:</label>
                    <input type="text" id="join-code" placeholder="Enter code" maxlength="8">
                    <label for="player-name">Your name:</label>
                    <input type="text" id="player-name" placeholder="Enter your name" maxlength="12">
                    <button class="btn btn-primary" onclick="joinGame()">Connect</button>
                    <div id="join-status"></div>
                </div>
                <div id="guest-lobby-panel" class="hidden panel glass-panel">
                    <header class="host-panel-header">
                        <h2>Game Lobby</h2>
                        <span class="host-network-status" role="status" aria-label="Connected" title="Connected"></span>
                    </header>
                    <div class="host-panel-grid">
                        <section class="host-invite-section" aria-labelledby="guest-game-code-label">
                            <span id="guest-game-code-label" class="field-label">Game code</span>
                            <div class="code-row">
                                <div id="guest-code" class="code-display" title="Share this code">...</div>
                            </div>
                            <p class="guest-share-hint" style="font-size:0.85em;color:#8a9aaa;margin-top:8px;">Share this code with other players</p>
                        </section>
                        <section class="host-roster-section" aria-labelledby="guest-roster-heading">
                            <div class="roster-header">
                                <h3 id="guest-roster-heading">Players <span id="guest-roster-count">0/2</span></h3>
                            </div>
                            <ul id="guest-lobby-players"></ul>
                        </section>
                    </div>
                    <div id="guest-waiting-status" class="guest-waiting-status" style="text-align:center;padding:12px 16px;color:#4a9;font-style:italic;">
                        Waiting for host to start the game...
                    </div>
                </div>
                <div id="host-name-panel" class="hidden panel glass-panel">
                    <h2>Host Game</h2>
                    <label for="host-name">Your name:</label>
                    <input type="text" id="host-name" placeholder="Enter your name" maxlength="12">
                    <button class="btn btn-primary" onclick="createHost()">Create Game</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div id="game-layout">
                <!-- Left panel: Player boards -->
                <div id="left-panel" class="side-panel">
                    <div id="player-boards"></div>
                </div>

                <!-- Center: Game board -->
                <div id="center-panel">
                    <div id="game-info-bar">
                        <div id="round-info"></div>
                        <div id="phase-info"></div>
                        <div id="turn-info"></div>
                    </div>
                    <div id="tactical-prompt" class="hidden" role="status"></div>
                    <div id="map-zoom-controls" aria-label="Map zoom controls">
                        <button type="button" data-map-zoom="out" aria-label="Zoom map out" onclick="Renderer.adjustMapZoom(-0.1)">−</button>
                        <button type="button" data-map-zoom="fit" onclick="Renderer.resetMapView()">Fit</button>
                        <span id="map-zoom-level" aria-live="polite">100%</span>
                        <button type="button" data-map-zoom="in" aria-label="Zoom map in" onclick="Renderer.adjustMapZoom(0.1)">+</button>
                    </div>
                    <div id="canvas-wrapper">
                        <div id="map-pan-surface">
                            <canvas id="game-canvas" width="1500" height="1050"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Right panel: Actions, objectives, items, log -->
                <div id="right-panel" class="side-panel">
                    <div id="action-panel" class="action-panel-overlay"></div>
                    <div id="card-area"></div>
                    <div id="game-log"></div>
                </div>
            </div>

            <!-- Hand of cards overlay (bottom) -->
            <div id="hand-bar" class="hand-bar-overlay"></div>

            <!-- Mobile bottom navigation -->
            <div id="mobile-nav" class="mobile-only">
                <button class="mobile-nav-btn active" data-tab="board" onclick="UI.switchTab('board')">Board</button>
                <button class="mobile-nav-btn" data-tab="players" onclick="UI.switchTab('players')">Players</button>
                <button class="mobile-nav-btn" data-tab="cards" onclick="UI.switchTab('cards')">Cards</button>
                <button class="mobile-nav-btn" data-tab="log" onclick="UI.switchTab('log')">Log</button>
            </div>
        </div>

        <!-- Overlay for modals (card selection, dice rolls, etc.) -->
        <div id="modal-overlay" class="hidden">
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/network.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
