<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nemesis: Retaliation - Digital Edition</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Atmospheric background -->
        <div id="bg-atmosphere"></div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen active">
            <div class="lobby-container">
                <header class="lobby-header">
                    <h1 class="title">NEMESIS</h1>
                    <div class="title-bar"></div>
                    <h2 class="subtitle">RETALIATION</h2>
                    <p class="tagline">Digital Edition</p>
                </header>
                <div class="lobby-actions">
                    <button id="btn-host" class="btn btn-primary" onclick="showHostPanel()">Host Game</button>
                    <button id="btn-join" class="btn btn-secondary" onclick="showJoinPanel()">Join Game</button>
                </div>
                <div id="host-panel" class="hidden panel glass-panel">
                    <h2>Host Game</h2>
                    <div class="host-section">
                        <p class="host-section-label">Share this code with your friends:</p>
                        <div id="host-code" class="code-display" title="Click to copy">Generating...</div>
                        <button id="copy-code-btn" class="btn btn-secondary host-copy-btn" onclick="copyGameCode()">📋 Copy Code</button>
                        <div id="join-qr-panel" class="join-qr-panel" aria-live="polite">
                            <p>Scan to join this game:</p>
                            <div id="join-qr-code" aria-label="QR code for joining this game"></div>
                        </div>
                        <div class="share-url-row">
                            <input type="text" id="join-url" class="share-url-input" readonly aria-label="Shareable join URL">
                            <button id="copy-url-btn" class="btn btn-secondary" onclick="copyJoinUrl()">📋 Copy URL</button>
                        </div>
                    </div>
                    <div class="host-section">
                        <div class="host-players-header">
                            <label for="num-players">Number of players:</label>
                            <select id="num-players">
                                <option value="1">1 (Solo)</option>
                                <option value="2" selected>2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                        <div id="player-list">
                            <h3>Players (0/5)</h3>
                            <ul id="lobby-players"></ul>
                        </div>
                    </div>
                    <button class="btn btn-primary host-start-btn" onclick="startGame()">Start Game</button>
                </div>
                <div id="join-panel" class="hidden panel glass-panel">
                    <h2>Join Game</h2>
                    <label for="join-code">Enter host code:</label>
                    <input type="text" id="join-code" placeholder="Enter code" maxlength="8">
                    <label for="player-name">Your name:</label>
                    <input type="text" id="player-name" placeholder="Enter your name" maxlength="12">
                    <button class="btn btn-primary" onclick="joinGame()">Connect</button>
                    <div id="join-status"></div>
                </div>
                <div id="host-name-panel" class="hidden panel glass-panel">
                    <h2>Host Game</h2>
                    <label for="host-name">Your name:</label>
                    <input type="text" id="host-name" placeholder="Enter your name" maxlength="12">
                    <button class="btn btn-primary" onclick="createHost()">Create Game</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div id="game-layout">
                <!-- Left panel: Player boards -->
                <div id="left-panel" class="side-panel">
                    <div id="player-boards"></div>
                </div>

                <!-- Center: Game board -->
                <div id="center-panel">
                    <div id="game-info-bar">
                        <div id="round-info"></div>
                        <div id="phase-info"></div>
                        <div id="turn-info"></div>
                    </div>
                    <div id="tactical-prompt" class="hidden" role="status"></div>
                    <div id="map-zoom-controls" aria-label="Map zoom controls">
                        <button type="button" data-map-zoom="out" aria-label="Zoom map out" onclick="Renderer.adjustMapZoom(-0.1)">−</button>
                        <button type="button" data-map-zoom="fit" onclick="Renderer.resetMapView()">Fit</button>
                        <span id="map-zoom-level" aria-live="polite">100%</span>
                        <button type="button" data-map-zoom="in" aria-label="Zoom map in" onclick="Renderer.adjustMapZoom(0.1)">+</button>
                    </div>
                    <div id="canvas-wrapper">
                        <div id="map-pan-surface">
                            <canvas id="game-canvas" width="1200" height="900"></canvas>
                        </div>
                    </div>
                    <div id="action-bar"></div>
                </div>

                <!-- Right panel: Cards and log -->
                <div id="right-panel" class="side-panel">
                    <div id="card-area"></div>
                    <div id="game-log"></div>
                </div>
            </div>

            <!-- Mobile bottom navigation -->
            <div id="mobile-nav" class="mobile-only">
                <button class="mobile-nav-btn active" data-tab="board" onclick="UI.switchTab('board')">Board</button>
                <button class="mobile-nav-btn" data-tab="players" onclick="UI.switchTab('players')">Players</button>
                <button class="mobile-nav-btn" data-tab="cards" onclick="UI.switchTab('cards')">Cards</button>
                <button class="mobile-nav-btn" data-tab="log" onclick="UI.switchTab('log')">Log</button>
            </div>
        </div>

        <!-- Overlay for modals (card selection, dice rolls, etc.) -->
        <div id="modal-overlay" class="hidden">
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/network.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
