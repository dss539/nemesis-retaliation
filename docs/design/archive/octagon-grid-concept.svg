<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1218"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="roomFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183b46"/>
      <stop offset="1" stop-color="#10242d"/>
    </linearGradient>
    <linearGradient id="landingFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#234b45"/>
      <stop offset="1" stop-color="#142c2c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="emptySlot">
      <polygon points="50.147186258,0 99.852813742,0 135,35.147186258 135,84.852813742 99.852813742,120 50.147186258,120 15,84.852813742 15,35.147186258"
               fill="#0d1820" fill-opacity="0.78" stroke="#4e6975" stroke-width="3" stroke-dasharray="9 7"/>
      <polygon points="54.289321881,10 95.710678119,10 125,39.289321881 125,80.710678119 95.710678119,110 54.289321881,110 25,80.710678119 25,39.289321881"
               fill="none" stroke="#243b46" stroke-width="1"/>
      <text x="75" y="58" text-anchor="middle" class="slotLabel">EMPTY</text>
      <text x="75" y="79" text-anchor="middle" class="slotSub">ROOM SLOT</text>
    </g>
    <g id="filledRoom">
      <polygon points="50.147186258,0 99.852813742,0 135,35.147186258 135,84.852813742 99.852813742,120 50.147186258,120 15,84.852813742 15,35.147186258"
               fill="url(#roomFill)" stroke="#62d3e5" stroke-width="4"/>
      <polygon points="54.289321881,10 95.710678119,10 125,39.289321881 125,80.710678119 95.710678119,110 54.289321881,110 25,80.710678119 25,39.289321881"
               fill="none" stroke="#3d7784" stroke-width="1.5"/>
    </g>
    <g id="landingRoom">
      <polygon points="50.147186258,0 99.852813742,0 135,35.147186258 135,84.852813742 99.852813742,120 50.147186258,120 15,84.852813742 15,35.147186258"
               fill="url(#landingFill)" stroke="#73e4a0" stroke-width="4" filter="url(#glow)"/>
      <polygon points="54.289321881,10 95.710678119,10 125,39.289321881 125,80.710678119 95.710678119,110 54.289321881,110 25,80.710678119 25,39.289321881"
               fill="none" stroke="#3f8063" stroke-width="1.5"/>
    </g>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .title { fill:#eef8fb; font-size:30px; font-weight:700; letter-spacing:1px; }
      .subtitle { fill:#8ca9b5; font-size:16px; }
      .panelTitle { fill:#d9edf2; font-size:19px; font-weight:700; letter-spacing:1.6px; }
      .panelSub { fill:#7896a3; font-size:14px; }
      .slotLabel { fill:#75909c; font-size:13px; font-weight:700; letter-spacing:1.5px; }
      .slotSub { fill:#4d6874; font-size:10px; letter-spacing:1px; }
      .roomName { fill:#effcff; font-size:15px; font-weight:700; letter-spacing:1px; }
      .roomSub { fill:#8fc0ca; font-size:11px; letter-spacing:1px; }
      .landingName { fill:#effff3; font-size:15px; font-weight:700; letter-spacing:1px; }
      .landingSub { fill:#8edaaa; font-size:11px; letter-spacing:1px; }
      .direction { fill:#d8edf2; font-size:12px; font-weight:800; }
      .note { fill:#98b4be; font-size:14px; }
      .noteStrong { fill:#d9edf2; font-size:14px; font-weight:700; }
      .legend { fill:#9bb5bf; font-size:13px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 112H1600" stroke="#1d333d" stroke-width="1"/>
  <text x="54" y="54" class="title">OCTAGON ROOM-GRAPH CONCEPT</text>
  <text x="54" y="84" class="subtitle">Eight possible neighbor directions per slot • fixed map drawn before exploration • corridors occupy reserved gaps</text>

  <rect x="40" y="132" width="740" height="664" rx="10" fill="#0b151c" stroke="#263e49" stroke-width="2"/>
  <rect x="820" y="132" width="740" height="664" rx="10" fill="#0b151c" stroke="#263e49" stroke-width="2"/>

  <text x="70" y="172" class="panelTitle">1  START OF GAME</text>
  <text x="70" y="198" class="panelSub">Every graph position is already visible as a blank octagon.</text>

  <!-- Left panel: all pre-drawn slots -->
  <use href="#emptySlot" x="120" y="230"/>
  <use href="#emptySlot" x="335" y="230"/>
  <use href="#emptySlot" x="550" y="230"/>
  <use href="#emptySlot" x="120" y="415"/>
  <use href="#landingRoom" x="335" y="415"/>
  <text x="410" y="469" text-anchor="middle" class="landingName">LANDING</text>
  <text x="410" y="491" text-anchor="middle" class="landingName">ZONE</text>
  <text x="410" y="516" text-anchor="middle" class="landingSub">REVEALED ROOM</text>
  <use href="#emptySlot" x="550" y="415"/>
  <use href="#emptySlot" x="120" y="600"/>
  <use href="#emptySlot" x="335" y="600"/>
  <use href="#emptySlot" x="550" y="600"/>

  <!-- Potential exit ports on central octagon -->
  <g fill="#5d7c89" stroke="#101b22" stroke-width="2">
    <circle cx="410" cy="415" r="6"/><circle cx="452.426" cy="432.574" r="6"/>
    <circle cx="470" cy="475" r="6"/><circle cx="452.426" cy="517.426" r="6"/>
    <circle cx="410" cy="535" r="6"/><circle cx="367.574" cy="517.426" r="6"/>
    <circle cx="350" cy="475" r="6"/><circle cx="367.574" cy="432.574" r="6"/>
  </g>

  <!-- Eight compass direction labels in the reserved gaps -->
  <g>
    <g transform="translate(410 388)"><circle r="14" fill="#203742"/><text y="4" text-anchor="middle" class="direction">N</text></g>
    <g transform="translate(503 397)"><circle r="16" fill="#203742"/><text y="4" text-anchor="middle" class="direction">NE</text></g>
    <g transform="translate(518 475)"><circle r="14" fill="#203742"/><text y="4" text-anchor="middle" class="direction">E</text></g>
    <g transform="translate(503 553)"><circle r="16" fill="#203742"/><text y="4" text-anchor="middle" class="direction">SE</text></g>
    <g transform="translate(410 562)"><circle r="14" fill="#203742"/><text y="4" text-anchor="middle" class="direction">S</text></g>
    <g transform="translate(317 553)"><circle r="16" fill="#203742"/><text y="4" text-anchor="middle" class="direction">SW</text></g>
    <g transform="translate(302 475)"><circle r="14" fill="#203742"/><text y="4" text-anchor="middle" class="direction">W</text></g>
    <g transform="translate(317 397)"><circle r="16" fill="#203742"/><text y="4" text-anchor="middle" class="direction">NW</text></g>
  </g>

  <text x="410" y="758" text-anchor="middle" class="noteStrong">The gaps exist even when no corridor exists.</text>
  <text x="410" y="779" text-anchor="middle" class="note">The eight dim ports mark potential graph edges, not automatic exits.</text>

  <text x="850" y="172" class="panelTitle">2  AFTER EXPLORATION</text>
  <text x="850" y="198" class="panelSub">Rooms fill existing slots. Only real graph edges become corridors.</text>

  <!-- Right panel corridors, rendered below octagons -->
  <g stroke-linecap="butt">
    <line x1="1170" y1="290" x2="1170" y2="475" stroke="#091015" stroke-width="38"/>
    <line x1="1170" y1="290" x2="1170" y2="475" stroke="#53c4d6" stroke-width="26"/>
    <line x1="955" y1="475" x2="1170" y2="475" stroke="#091015" stroke-width="38"/>
    <line x1="955" y1="475" x2="1170" y2="475" stroke="#53c4d6" stroke-width="26"/>
    <line x1="1170" y1="475" x2="1385" y2="660" stroke="#091015" stroke-width="38"/>
    <line x1="1170" y1="475" x2="1385" y2="660" stroke="#53c4d6" stroke-width="26"/>
    <line x1="1170" y1="290" x2="1170" y2="475" stroke="#9deaf3" stroke-width="2" stroke-dasharray="8 9"/>
    <line x1="955" y1="475" x2="1170" y2="475" stroke="#9deaf3" stroke-width="2" stroke-dasharray="8 9"/>
    <line x1="1170" y1="475" x2="1385" y2="660" stroke="#9deaf3" stroke-width="2" stroke-dasharray="8 9"/>
  </g>

  <!-- Right panel map slots/rooms -->
  <use href="#emptySlot" x="880" y="230"/>
  <use href="#filledRoom" x="1095" y="230"/>
  <text x="1170" y="286" text-anchor="middle" class="roomName">SURGERY</text>
  <text x="1170" y="309" text-anchor="middle" class="roomSub">N EDGE</text>
  <use href="#emptySlot" x="1310" y="230"/>

  <use href="#filledRoom" x="880" y="415"/>
  <text x="955" y="471" text-anchor="middle" class="roomName">ARMORY</text>
  <text x="955" y="494" text-anchor="middle" class="roomSub">W EDGE</text>
  <use href="#landingRoom" x="1095" y="415"/>
  <text x="1170" y="469" text-anchor="middle" class="landingName">LANDING</text>
  <text x="1170" y="491" text-anchor="middle" class="landingName">ZONE</text>
  <text x="1170" y="516" text-anchor="middle" class="landingSub">3 ACTUAL EDGES</text>
  <use href="#emptySlot" x="1310" y="415"/>

  <use href="#emptySlot" x="880" y="600"/>
  <use href="#emptySlot" x="1095" y="600"/>
  <use href="#filledRoom" x="1310" y="600"/>
  <text x="1385" y="656" text-anchor="middle" class="roomName">LAB</text>
  <text x="1385" y="679" text-anchor="middle" class="roomSub">SE EDGE</text>

  <text x="1190" y="758" text-anchor="middle" class="noteStrong">Exploration fills a slot; it never creates or moves the grid.</text>
  <text x="1190" y="779" text-anchor="middle" class="note">Cardinal and diagonal corridors use the padding between octagons.</text>

  <!-- Legend -->
  <g transform="translate(470 850)">
    <polygon points="10.544155877,0 25.455844123,0 36,10.544155877 36,25.455844123 25.455844123,36 10.544155877,36 0,25.455844123 0,10.544155877" fill="#0d1820" stroke="#4e6975" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="64" y="23" class="legend">pre-drawn empty node</text>
    <polygon transform="translate(250 0)" points="10.544155877,0 25.455844123,0 36,10.544155877 36,25.455844123 25.455844123,36 10.544155877,36 0,25.455844123 0,10.544155877" fill="url(#roomFill)" stroke="#62d3e5" stroke-width="2"/>
    <text x="314" y="23" class="legend">explored room</text>
    <line x1="490" y1="18" x2="560" y2="18" stroke="#53c4d6" stroke-width="16"/>
    <text x="575" y="23" class="legend">actual graph edge / corridor</text>
  </g>
</svg>
