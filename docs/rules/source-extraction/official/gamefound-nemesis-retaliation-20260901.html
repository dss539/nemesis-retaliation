                    document.documentElement.setAttribute('data-theme', 'dark');

                }
            }
        })();

me\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003E\u003Cb\u003E\u0022This might be the best Nemesis yet!\u0022\u003C/b\u003E - Shea, Rahdo\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan data-video=\u0022embed\u0022\u003E\u003Ciframe src=\u0022https://www.youtube.com/embed/FnDZSOn2Hjo\u0022 loading=\u0022lazy\u0022 height=\u0022100%\u0022 width=\u0022100%\u0022 allowfullscreen=\u0022true\u0022\u003E\u003C/iframe\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022background-color: rgba(0, 0, 0, 0); font-family: Arial, sans-serif; font-size: 18px\u0022\u003E\u003Cb\u003E\u0022This game is a tightrope walk between whiteknuckle action and inescapable dread. It\u0027s a blast!\u0022\u003C/b\u003E - Mike, One Stop Co-op Shop\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan data-video=\u0022embed\u0022\u003E\u003Ciframe src=\u0022https://www.youtube.com/embed/YAJUYY2Vabs\u0022 loading=\u0022lazy\u0022 height=\u0022100%\u0022 width=\u0022100%\u0022 allowfullscreen=\u0022true\u0022 data-gtm-yt-inspected-18=\u0022true\u0022 data-gtm-yt-inspected-17=\u0022true\u0022\u003E\u003C/iframe\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003E\u0022Nemesis has always kept players on their toes, and this one is no exception. A very fun addition to the series!\u201D \u003C/span\u003E\u003C/b\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003E- Adam, Rolling Solo\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan data-video=\u0022embed\u0022\u003E\u003Ciframe src=\u0022https://www.youtube.com/embed/PxlDKzg9cFA\u0022 loading=\u0022lazy\u0022 height=\u0022100%\u0022 width=\u0022100%\u0022 allowfullscreen=\u0022true\u0022 data-gtm-yt-inspected-18=\u0022true\u0022 data-gtm-yt-inspected-17=\u0022true\u0022\u003E\u003C/iframe\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003E\u0022There\u0027s a different flavor of tension in this one, but it\u0027s tension FOR SURE!\u0026nbsp; They\u0027ve also succeeded in making a number of quality of life improvements but still managed to make it feel as brutal as ever.\u0022 \u003C/span\u003E\u003C/b\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003E- David, ManVsMeeple\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan data-video=\u0022embed\u0022\u003E\u003Ciframe src=\u0022https://www.youtube.com/embed/no-1EqFuDNE\u0022 loading=\u0022lazy\u0022 height=\u0022100%\u0022 width=\u0022100%\u0022 allowfullscreen=\u0022true\u0022 data-gtm-yt-inspected-18=\u0022true\u0022 data-gtm-yt-inspected-17=\u0022true\u0022\u003E\u003C/iframe\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003E\u0022Nemesis Retaliation takes all my favorite parts of the nemesis system and streamlines it into a quicker, more fun experience.\u0022\u003C/span\u003E\u003C/b\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003E - Bryan, Game Brigade\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan data-video=\u0022embed\u0022\u003E\u003Ciframe src=\u0022https://www.youtube.com/embed/yKFoPraRWqc\u0022 loading=\u0022lazy\u0022 height=\u0022100%\u0022 width=\u0022100%\u0022 allowfullscreen=\u0022true\u0022 data-gtm-yt-inspected-18=\u0022true\u0022 data-gtm-yt-inspected-17=\u0022true\u0022\u003E\u003C/iframe\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022background-color: rgba(0, 0, 0, 0); font-family: Arial, sans-serif; font-size: 18px\u0022\u003E\u003Cb\u003E\u0022Nemesis retaliation is not just more of the same. It is finally time to stand a fight.\u0022\u003C/b\u003E - Jesse, Quackalope\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan data-video=\u0022embed\u0022\u003E\u003Ciframe src=\u0022https://www.youtube.com/embed/DTXmsiev_gs\u0022 loading=\u0022lazy\u0022 height=\u0022100%\u0022 width=\u0022100%\u0022 allowfullscreen=\u0022true\u0022 data-gtm-yt-inspected-18=\u0022true\u0022 data-gtm-yt-inspected-17=\u0022true\u0022\u003E\u003C/iframe\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022background-color: rgba(0, 0, 0, 0); font-family: Arial, sans-serif; font-size: 18px\u0022\u003E\u003Cb\u003ERetaliation builds on both the teamwork and mistrust that made Nemesis a modern classic....but now you\u0027re actually exploring the ship as you go and laying waste to more aliens along the way. These and other changes are welcome additions that build on the familiar while giving you something new to enjoy!\u003C/b\u003E - Alex, BoardGameCo\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(53, 50, 69, 1)\u0022\u003E/video TBA/\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan styl mage/richtext/10a70e81-fb9b-4223-9e5a-dc7b0e61bd26.jpg\u0022 id=\u0022gfu-img-f2447436-209c-3ecd-aef3-ee29cb4cb084\u0022 data-image-height=\u00221244\u0022 data-image-width=\u00221200\u0022 class=\u0022gfu-embed__item\u0022 loading=\u0022lazy\u0022 \u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ENemesis is one of the most popular Board Games in the world \u2013 currently occupying the 21st slot for the best game of all time (BGG ranking) and #11 for best thematic board game in the world.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EIt was followed by Nemesis Lockdown (that was more of an evolution of the formula), and now, the trilogy\u0027s final part is being crowdfunded.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ERetaliation will be the biggest \u0022revolution\u0022 in the gameplay mechanics, but still keeping all of the best core ideas behind the franchise!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cdiv class=\u0022gfu-embed\u0022 style=\u0022padding-top: 30%;\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/931f6d4b-0990-4d3d-9877-3ffd3d6a3505.jpg\u0022 id=\u0022gfu-img-89eb7ffd-436b-317d-7c9f-a77267d7ce14\u0022 data-image-height=\u0022369\u0022 data-image-width=\u00221200\u0022 class=\u0022gfu-embed__item\u0022 loading=\u0022lazy\u0022 \u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EInspired by Sci-Fi horror classics, Nemesis brings you a truly cinematic experience that you can enjoy as a true solo, co-op, or a semi co-op.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EPerhaps the most iconic mode is semi co-op, where each player has his own secret objective that sometimes will be team-based\u2026 but it also can target to kill one of the other players.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ENemesis is known for the thematic, cinematic-like experience that emerges 100% from the pure gameplay and is different in every game.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ESometimes, the first room you enter will spawn a deadly Queen.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ESometimes, right before stepping into the escape pod, your friend will paralyze you with a teaser and escape themselves, and sometimes, you will lie to the whole team about coordinates and lead the ship to Mars, completing your secret objective.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cdiv class=\u0022gfu-embed\u0022 style=\u0022padding-top: 66%;\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/afa7e1d1-0712-4fcd-a6ae-e173dacf03b5.jpg\u0022 id=\u0022gfu-img-b77de8de-6854-db12-0e83-cb1ca448ed9e\u0022 data-image-height=\u0022797\u0022 data-image-width=\u00221200\u0022 class=\u0022gfu-embed__item\u0022 loading=\u0022lazy\u0022 \u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ENemesis (Original) was the first in the series, and it takes place on Nemesis ship \u2013 coming with few gameplay and cosmetic expansions.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ENemesis: Lockdown is a natural evolution \u2013 it is set in the secret base on Mars and has a different setting and accompanying mechanics, as well as dedicated alien races:\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ENight Stalkers and Chytridis.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EFinally, Nemesis: Retaliation is the final epic part of the trilogy \u2013 this time, as a Marine squad, you are entering an alien nest and fighting the hordes.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cdiv class=\u0022gfu-embed\u0022 style=\u0022padding-top: 47%;\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.com/richtextimage/richtext/8ce918b1-cd5a-43c7-9674-946d4afe07e4.jpg\u0022 id=\u0022gfu-img-dca78a2d-2c78-47f3-3162-edf1c88009ef\u0022 data-image-height=\u0022575\u0022 data-image-width=\u00221200\u0022 class=\u0022gfu-embed__item\u0022 loading=\u0022lazy\u0022 \u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EThose 3 parts are fully standalone and can be played in any order, offering a classic board game experience.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EAll of them are highly thematic horror experiences with some randomness, tons of emotion, and A LOT of play above the board with your friends.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EFirst Nemesis\u003C/span\u003E\u003C/b\u003E\u003Ca href=\u0022https://boardgamegeek.com/boardgame/167355/nemesis\u0022 target=\u0022_blank\u0022 rel=\u0022nofollow noopener noreferrer                                                                                         \u0022\u003E\u003Cdiv class=\u0022gfu-embed\u0022 sty u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003E\u003Cb\u003E\u003Ci\u003E\u0022It\u0027s an experience, not a board game!\u0022\u003C/i\u003E\u003C/b\u003E\u003C/span\u003E\u003Cspan style=\u0022font-size: 18px\u0022\u003E- Jesse, Quackalope\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan data-video=\u0022embed\u0022\u003E\u003Ciframe src=\u0022https://www.youtube.com/embed/jBZ-hnL7SDA\u0022 loading=\u0022lazy\u0022 height=\u0022100%\u0022 width=\u0022100%\u0022 allowfullscreen=\u0022true\u0022 data-gtm-yt-inspected-6=\u0022true\u0022 data-gtm-yt-inspected-16=\u0022true\u0022 data-gtm-yt-inspected-17=\u0022true\u0022\u003E\u003C/iframe\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003E\u003Cb\u003EGlobal phenomenon\u003C/b\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ENemesis has transcended the realm of board gaming to become a global phenomenon, capturing the imagination far beyond its original community.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EIts influence extends into various aspects of popular culture, inspiring creativity and passion.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ERecognized as a brand that offers a cinematic experience, Nemesis has established itself as a symbol of innovation and excitement.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003E\u003Cb\u003E\u003Ci\u003E\u0022We are going to play the six hours long, very thematic - Nemesis.\u0022 \u003C/i\u003E\u003C/b\u003E- Eric Cartman in Southpark Season 23 Episode 7 - \u0022Board Girls\u0022 by South Park Studios\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan data-video=\u0022embed\u0022\u003E\u003Ciframe src=\u0022https://www.youtube.com/embed/yaSgxWzUfl0\u0022 loading=\u0022lazy\u0022 height=\u0022100%\u0022 width=\u0022100%\u0022 allowfullscreen=\u0022true\u0022 data-gtm-yt-inspected-6=\u0022true\u0022 data-gtm-yt-inspected-16=\u0022true\u0022 data-gtm-yt-inspected-17=\u0022true\u0022\u003E\u003C/iframe\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003ECheck out what the board gaming community is capable of!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EJay is a huge Nemesis fan, and he created a unique 3D board for our game!\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan data-video=\u0022embed\u0022\u003E\u003Ciframe src=\u0022https://www.youtube.com/embed/A4Wa5xtmJyE\u0022 loading=\u0022lazy\u0022 height=\u0022100%\u0022 width=\u0022100%\u0022 allowfullscreen=\u0022true\u0022 data-gtm-yt-inspected-6=\u0022true\u0022 data-gtm-yt-inspected-16=\u0022true\u0022 data-gtm-yt-inspected-17=\u0022true\u0022\u003E\u003C/iframe\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EGda\u0144sk.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EAmundsen Street 5.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EIt is in this place that the world\u0027s first SUCH A LARGE mural for a board game, was created.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EOne of the largest compositions using UV paint in Europe (324 m\u00B2).\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EDozens of man-hours of artists\u0027 work and a breathtaking final effect.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022font-family: Calibri, serif; font-size: 18px\u0022\u003EAll this could be seen in the period of October - November 2022.\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan data-video=\u0022embed\u0022\u003E\u003Ciframe src=\u0022https://www.youtube.com/embed/Y17NJZbixkw\u0022 loading=\u0022lazy\u0022 height=\u0022100%\u0022 width=\u0022100%\u0022 allowfullscreen=\u0022true\u0022 data-gtm-yt-inspected-6=\u0022true\u0022 data-gtm-yt-inspected-16=\u0022true\u0022 data-gtm-yt-inspected-17=\u0022true\u0022\u003E\u003C/iframe\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E","originalHeader":"Nemesis trilogy","descriptionInfo":null,"type":0,"children":[]},{"projectDescriptionSectionID":17776,"header":"Refunds and cancellation","content":"\u003Cdiv\u003EDuring the crowdfunding campaign, you can freely modify or cancel the order. Gamefound only collects your payment at the end of a successfully funded campaign.\u003C/div\u003E\u003Cdiv\u003EIf you\u0027re using the Immediate payment option (like Paypal), you\u0027d not be able to modify the pledge within the campaign (but will be able to do so in the pledge manager); if you\u0027d like to cancel the pledge, you\u0027d nee
